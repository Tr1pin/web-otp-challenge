spring:
  application:
    name: otp-challenge
  profiles:
    active: dev
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET:dev-only-clave-de-desarrollo-no-usar-en-produccion-32chars}
  expiration: 86400000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

---
# ============ PERFIL DEV (local con Docker) ============
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/otp_challenge
    username: otp_user
    password: otp_pass_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update        # crea/actualiza tablas solas en dev
    show-sql: true            # ver las queries en consola
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG

---
# ============ PERFIL PROD (Neon / Railway) ============
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}          # variable de entorno en Railway/Neon
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # en prod NO tocar el esquema automáticamente
    show-sql: false
    open-in-view: false

server:
  port: ${PORT:8080}              # Railway inyecta el puerto

